name: Release Anne TV

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (örn. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_B64: ${{ secrets.ANNE_TV_KEYSTORE_B64 }}
      ANNE_TV_KEYSTORE_PASSWORD: ${{ secrets.ANNE_TV_KEYSTORE_PASSWORD }}
      ANNE_TV_KEY_ALIAS: ${{ secrets.ANNE_TV_KEY_ALIAS }}
      ANNE_TV_KEY_PASSWORD: ${{ secrets.ANNE_TV_KEY_PASSWORD }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate manifests
        run: python3 scripts/validate_project.py

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -1)
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo "Uygulama sürümü okunamadı." >&2
            exit 1
          fi
          if [[ "$TAG" != "v$VERSION_NAME" ]]; then
            echo "Tag ($TAG) versionName (v$VERSION_NAME) ile eşleşmiyor." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Verify signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$ANNE_TV_KEYSTORE_PASSWORD"
          test -n "$ANNE_TV_KEY_ALIAS"
          test -n "$ANNE_TV_KEY_PASSWORD"

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/anne-tv-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANNE_TV_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace -PANNE_TV_REPO="$GITHUB_REPOSITORY"

      - name: Prepare release asset and manifest
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AnneTV.apk
          SHA256=$(sha256sum dist/AnneTV.apk | awk '{print $1}')
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.meta.outputs.tag }}/AnneTV.apk"
          python3 - <<PY
          import json
          data = {
              "versionCode": int("${{ steps.meta.outputs.version_code }}"),
              "versionName": "${{ steps.meta.outputs.version_name }}",
              "apkUrl": "$APK_URL",
              "sha256": "$SHA256"
          }
          with open("dist/update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ steps.meta.outputs.tag }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AnneTV.apk --clobber
          else
            gh release create "$TAG" dist/AnneTV.apk \
              --title "Anne TV ${{ steps.meta.outputs.version_name }}" \
              --notes "Anne TV ${{ steps.meta.outputs.version_name }} otomatik sürümü."
          fi

      - name: Publish update.json to main
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_BRANCH='${{ github.event.repository.default_branch }}'
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          cp dist/update.json update.json
          if git diff --quiet -- update.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update Anne TV release manifest [skip ci]"
          git push origin "$DEFAULT_BRANCH"
