name: Build Anne TV

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "update.json"
      - "README.md"
      - "GITHUB_SETUP.md"

permissions:
  contents: read

concurrency:
  group: anne-tv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -1)
          fi
          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager bulunamadı: $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate manifests
        run: python3 scripts/validate_project.py

      - name: Android Lint
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug --stacktrace -PANNE_TV_REPO="$GITHUB_REPOSITORY"
          STATUS=$?
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [[ -f "$REPORT" ]]; then
            echo "----- Android Lint report -----"
            cat "$REPORT"
          fi
          exit $STATUS

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace -PANNE_TV_REPO="$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: AnneTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
